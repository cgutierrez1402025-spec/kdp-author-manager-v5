services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - laravel
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G

  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    entrypoint: /entrypoint.sh
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:p68+25OKYkMrhR6Bq/MXBJk55c8DhA77BvT9fj+P0cg=
      - DB_CONNECTION=sqlite
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - SESSION_DRIVER=database
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache
      - ./database:/app/database
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - laravel
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  laravel:
    driver: bridge

volumes:
  ollama_data:
